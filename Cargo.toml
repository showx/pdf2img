[package]
name = "pdf2img"
version = "0.1.0"
edition = "2021"
description = "把 PDF 每一页转换成常见图片格式，并保存到 PDF 所在目录"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "persistence"] }
hayro = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
